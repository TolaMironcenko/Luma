name: Build Unsigned iOS and macOS Apps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build Xcode Workspace
        run: |
          xcodebuild build \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Luma.app build/Payload/
          cd build && zip -r Luma.ipa Payload/

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: build/Luma.ipa

  build-macos:
    name: Build macOS ZIP
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Build macOS App
        run: |
          xcodebuild build \
            -project Luma.xcodeproj \
            -scheme LumaMac \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Compress macOS App
        run: |
          cd build/DerivedData/Build/Products/Release
          zip -r Luma.zip Luma.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-zip
          path: build/DerivedData/Build/Products/Release/Luma.zip
