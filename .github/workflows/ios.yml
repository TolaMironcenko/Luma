name: iOS CI

on:
  push:
    branches: [main develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test SwiftUI App
    runs-on: macos-26 # Uses Apple Silicon M1/M2 runners

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Select the correct Xcode version
      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      # Step 3: Load dependencies if using Swift Package Manager
      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Luma.xcodeproj -scheme Luma

      # Step 4: Build and run tests using xcodebuild
      - name: Build and Test
        run: |
          xcodebuild test \
            -project Luma.xcodeproj \
            -scheme Luma \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.4.1' \
            -quiet
